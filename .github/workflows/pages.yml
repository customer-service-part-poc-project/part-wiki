# raw/·data/·scripts/ 가 바뀌거나 매일 정해진 시각이 되면
# 말투 신호(data/signals.json)를 재생성하고 파트원 프로필 사이트를 GitHub Pages 로 배포한다.
#
# ⚠️ 최초 1회: 저장소 Settings → Pages → Build and deployment → Source 를
#    "GitHub Actions" 로 지정해야 한다. (지정 전에는 deploy 단계가 실패한다)
#
# ⚠️ 이 저장소는 public 이다 (2026-09-11 확인, 파트가 인지하고 공개로 두기로 결정).
#    그래서 이 사이트는 위키 본문(wiki/, raw/)을 내보내지 않고,
#    data/profiles/*.json · data/projects/*.json 화이트리스트만 빌드한다 (docs/PRIVACY.md 참고).
name: 멤버 프로필 사이트 배포

on:
  schedule:
    # 매일 09:00 KST(UTC+9) = 00:00 UTC (같은 날 기준)
    - cron: '0 0 * * *'
  push:
    branches: [main]
    paths:
      - 'raw/**'
      - 'data/**'
      - 'scripts/**'
      - 'docs/PROFILE_SCHEMA.md'
      - 'docs/PROJECT_SCHEMA.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:   # Actions 탭에서 수동 실행

permissions:
  contents: write   # 신호 재생성 결과(data/signals.json)를 커밋하기 위함
  pages: write
  id-token: write

# 동시에 여러 배포가 겹치지 않도록 한다. 진행 중인 배포는 취소하지 않고 순서대로 실행 (어중간한 상태 방지)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - uses: actions/setup-python@main

      # 렌더러가 깨진 채로 배포되는 것을 막는다. 실패하면 이후 단계(신호 갱신·빌드·배포)를 진행하지 않는다
      - name: 테스트
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      # 원문 인용은 남기지 않고 집계 수치만 갱신한다 (docs/PRIVACY.md)
      - name: 신호 재생성
        run: python3 scripts/extract_signals.py

      # data/signals.json 이 실제로 바뀌었는지 확인한다. push 트리거에서는 커밋하지 않으므로 건너뛴다
      - name: 신호 변경 여부 확인
        id: diff
        if: github.event_name == 'schedule'
        run: |
          if git diff --quiet -- data/signals.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # schedule(하루 1회) 트리거이고 실제로 변경이 있을 때만 커밋한다.
      # push 트리거에서 되커밋하면 워크플로가 자기 자신을 다시 발동시켜 루프가 된다.
      - name: 신호 변경 커밋
        if: github.event_name == 'schedule' && steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/signals.json
          git commit -m "🤖 일일 신호 갱신 ($(date -u +%Y-%m-%d))"
          git push

      # 형식이 어긋난 프로필 JSON 은 build_site.py 가 해당 파일만 건너뛰고 이유를 출력한다
      # (한 사람 때문에 전체 빌드가 막히지 않는다. docs/PROFILE_SCHEMA.md)
      - name: 사이트 빌드
        run: python3 scripts/build_site.py --out _site

      - uses: actions/configure-pages@main
        with:
          enablement: true   # Pages 가 꺼져 있으면 켜본다. 권한이 없으면 수동 설정 필요

      - uses: actions/upload-pages-artifact@main
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@main
